<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paystub → OF-288 Converter</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  #status { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.85rem;
            background: #f4f4f4; border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem;
            min-height: 2rem; margin-top: 1rem; }
  #status.error { background: #fdeaea; border-color: #e0a0a0; color: #7a1f1f; }
  #controls { display: flex; gap: 0.5rem; align-items: center; margin-top: 1rem; }
  button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.5; }
  #downloads { margin-top: 1rem; }
  #downloads a { display: inline-block; margin: 0.25rem 0.5rem 0.25rem 0; padding: 0.4rem 0.8rem;
                 background: #2a6; color: white; text-decoration: none; border-radius: 4px; }
  .hint { color: #666; font-size: 0.9rem; }
  fieldset { margin-top: 1rem; border: 1px solid #ddd; border-radius: 6px; }
  fieldset .row { display: flex; gap: 0.75rem; margin: 0.5rem 0; flex-wrap: wrap; }
  fieldset label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 0.2rem; flex: 1 1 160px; }
  fieldset input, fieldset select { padding: 0.3rem; font-size: 0.95rem; }
</style>
</head>
<body>
  <h1>Paystub → OF-288 Converter</h1>
  <p class="hint">Runs entirely in your browser — the paystub PDF never leaves your machine.</p>

  <fieldset id="profileFields">
    <legend>Your info (saved only in this browser, never uploaded anywhere)</legend>
    <div class="row">
      <label>Hired At <input id="p_hired_at" placeholder="e.g. CO-PSF"></label>
      <label>Employee Common Identifier <input id="p_eci"></label>
      <label>Type of Employment
        <select id="p_type">
          <option value="Federal">Federal</option>
          <option value="Casual">Casual</option>
          <option value="Other">Other</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Hiring Unit Name <input id="p_unit_name" placeholder="e.g. SAN CARLOS RANGER DISTRICT"></label>
      <label>Hiring Unit Phone <input id="p_phone" placeholder="e.g. 719-260-8500"></label>
      <label>Hiring Unit Fax <input id="p_fax"></label>
    </div>
  </fieldset>

  <div id="controls">
    <input type="file" id="fileInput" accept="application/pdf" disabled>
    <button id="convertBtn" disabled>Convert</button>
  </div>

  <div id="downloads"></div>
  <div id="status">Starting Python environment…</div>

  <script type="module" src="app.js"></script>
</body>
</html>
